name: Build

# Bu workflow, kod GitHub'ın kendi sunucularında (Windows, Apple Silicon Mac)
# derlenir. Böylece kullanıcılar "rastgele bir exe" değil, tamamen açık
# kaynaktan GitHub tarafından üretilmiş bir dosya indirmiş olur. Derleme
# günlükleri (Actions sekmesi) herkese açıktır.
#
# This workflow builds the code on GitHub's own servers (Windows, Apple
# Silicon Mac). Users get a file built transparently from public source,
# not a random binary. Build logs are public under the Actions tab.
#
# Not: Intel Mac (x86_64) derlemesi yok. GitHub Aralık 2025'te macos-13
# runner'ını emekliye ayırdı; Intel Mac desteği istenirse macos-15-intel
# etiketiyle ayrı bir job eklenebilir.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch: {}   # Actions sekmesinden elle de tetiklenebilir

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Bağımlılıkları kur
        run: pip install PySide6 pillow pyinstaller
      - name: exe derle
        run: >
          pyinstaller --onefile --noconsole
          --name "DosyaTuruneGoreAyir"
          dosya_turune_gore_ayir.py
      - uses: actions/upload-artifact@v4
        with:
          name: DosyaTuruneGoreAyir-Windows
          path: dist/DosyaTuruneGoreAyir.exe

  build-macos-arm64:
    # macos-15 runner'ları Apple Silicon (M serisi, arm64) üzerinde çalışır
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Bağımlılıkları kur
        run: pip install PySide6 pillow pyinstaller
      - name: .app derle
        run: >
          pyinstaller --windowed
          --name "DosyaTuruneGoreAyir"
          dosya_turune_gore_ayir.py
      - name: .app dosyasını ziple
        run: |
          cd dist
          ditto -c -k --sequesterRsrc --keepParent "DosyaTuruneGoreAyir.app" "DosyaTuruneGoreAyir-macOS-AppleSilicon.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: DosyaTuruneGoreAyir-macOS-AppleSilicon
          path: dist/DosyaTuruneGoreAyir-macOS-AppleSilicon.zip

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build-windows, build-macos-arm64]
    runs-on: ubuntu-latest
    permissions:
      contents: write   # Release oluşturabilmek için yazma izni şart
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Release oluştur ve dosyaları ekle
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/DosyaTuruneGoreAyir-Windows/DosyaTuruneGoreAyir.exe
            artifacts/DosyaTuruneGoreAyir-macOS-AppleSilicon/DosyaTuruneGoreAyir-macOS-AppleSilicon.zip
